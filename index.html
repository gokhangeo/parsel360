<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TKGM Parsel Sorgu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0f1720; --panel:#16212c; --line:#263746; --txt:#e8eef4;
    --muted:#8fa3b5; --accent:#2f9e6b; --accent2:#3d7bff; --warn:#d9822b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  #app{display:flex;flex-direction:column;height:100%}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .tag{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:10px}
  #bar{padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,input,button{font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--line);background:#0d151d;color:var(--txt);padding:8px 10px;outline:none}
  select:focus,input:focus{border-color:var(--accent2)}
  select{min-width:120px;flex:1 1 130px}
  input{width:92px}
  button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;cursor:pointer;flex:0 0 auto}
  button.sec{background:#22303d;border-color:var(--line);color:var(--txt);font-weight:500}
  button:active{filter:brightness(.92)}
  button:disabled{opacity:.5;cursor:default}
  #map{flex:1;min-height:220px;background:#0a1116}
  #info{padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:13px;line-height:1.6;max-height:34vh;overflow:auto}
  #info .row{display:flex;gap:8px}
  #info b{color:#fff}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:2px 0}
  .kv span:nth-child(odd){color:var(--muted)}
  .msg{color:var(--muted)}
  .err{color:#ff8a8a}
  .ok{color:#6de3a8}
  .coords{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);word-break:break-all}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .chk input{width:auto}
  #tabs{display:flex;gap:6px}
  #tabs button{padding:6px 12px;font-size:13px;border-radius:8px}
  #tabs button.on{background:var(--accent2);border-color:var(--accent2)}
  .hint{font-size:11px;color:var(--muted)}
  #sp{display:none;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #dlmenu{position:absolute;top:100%;right:12px;z-index:1200;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:6px;display:none;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #dlmenu button{width:100%;text-align:left}
  #bar{position:relative}
  .pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:#22303d;color:var(--muted);margin-left:6px}
  #toolpanel{display:none;width:100%;padding:8px;background:#101a23;border:1px solid var(--line);border-radius:10px;gap:6px;flex-wrap:wrap;align-items:center}
  #toolpanel.on{display:flex}
  #favlist{width:100%;max-height:160px;overflow:auto;font-size:12px}
  .favrow{display:flex;justify-content:space-between;align-items:center;padding:5px;border-bottom:1px solid var(--line)}
  .leaflet-popup-content{color:#111}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🗺️ TKGM Parsel Sorgu</h1>
    <span class="tag">il → ilçe → mahalle → ada/parsel</span>
    <span id="sp"></span>
  </header>

  <div id="bar">
    <div id="tabs">
      <button id="tb-adm" class="on">İdari</button>
      <button id="tb-coord" class="sec">Koordinat</button>
      <button id="tb-imar" class="sec">e-İmar</button>
    </div>

    <div id="pane-adm" style="display:contents">
      <select id="il"><option value="">İl…</option></select>
      <select id="ilce" disabled><option value="">İlçe…</option></select>
      <select id="mah" disabled><option value="">Mahalle…</option></select>
      <input id="ada" placeholder="Ada" inputmode="numeric">
      <input id="parsel" placeholder="Parsel" inputmode="numeric">
      <button id="btn-sorgu">Sorgula</button>
      <button id="btn-ada" class="sec" title="Seçilen numara aralığında adanın parsellerini arar">Ada Tara</button>
      <select id="ada-limit" style="min-width:112px;flex:0 0 auto" title="Taranacak parsel numarası üst sınırı">
        <option value="100">1–100</option>
        <option value="250" selected>1–250</option>
        <option value="500">1–500</option>
        <option value="1000">1–1000</option>
      </select>
    </div>

    <div id="pane-coord" style="display:none;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="lat" placeholder="Enlem" value="37.0012" style="width:110px">
      <input id="lon" placeholder="Boylam" value="35.3213" style="width:110px">
      <button id="btn-coord">Bul</button>
      <span class="hint">parsel/{lat}/{lon}</span>
    </div>

    <div id="pane-imar" style="display:none;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="imar-il" style="min-width:130px;flex:1 1 130px"><option value="">İl…</option></select>
      <select id="imar-ilce" disabled style="min-width:130px;flex:1 1 130px"><option value="">İlçe…</option></select>
      <button id="btn-imar" disabled>e-İmar Sayfasını Aç</button>
      <span class="hint">Sadece e-imar desteği olan belediyeler</span>
    </div>

    <select id="base" style="flex:0 0 auto;min-width:118px">
      <option value="hd">HD Uydu + Cadde</option>
      <option value="sat">Esri Uydu + Sınır</option>
      <option value="cadde">Salt Cadde/Sokak</option>
    </select>
    <button id="btn-dl" class="sec">İndir ▾</button>
    <div id="dlmenu">
      <button data-fmt="kml" class="sec">KML (Google Earth)</button>
      <button data-fmt="json" class="sec">GeoJSON</button>
      <button data-fmt="dxf" class="sec">DXF (CAD)</button>
      <button data-fmt="shp" class="sec">Shapefile (ZIP)</button>
    </div>
    <button id="btn-tools" class="sec">Araçlar ▾</button>
    <button id="btn-fav" class="sec">☆ Favori</button>
    <label class="chk"><input id="multi" type="checkbox"> Çoklu</label>
    <button id="btn-gps" class="sec">⌖ GPS</button>
    <button id="btn-measure" class="sec">📏 Ölç</button>
    <button id="btn-google" class="sec">Google Maps</button>
    <button id="btn-tkgm" class="sec">TKGM</button>
    <button id="btn-clear" class="sec">Temizle</button>
    <div id="toolpanel">
      <select id="measure-type" style="min-width:110px;flex:0 0 auto"><option value="distance">Mesafe</option><option value="area">Alan</option></select>
      <button id="btn-measure-finish" class="sec">Ölçümü Bitir</button>
      <button id="btn-measure-clear" class="sec">Ölçümü Sil</button>
      <button id="btn-auto-imar" class="sec" disabled>İmar katmanı yok</button>
      <span id="wms-status" class="hint">İl/ilçe seçilince açık imar servisi otomatik aranır.</span>
      <button id="btn-wms-clear" class="sec">İmar Katmanını Kapat</button>
      <div id="favlist"></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="info">
    <div class="msg">İl seçerek başla. Mahalle seçilince alanına yakınlaşır; ada + parsel girip <b>Sorgula</b>'ya bas — parsel geometrisi haritada çizilir.</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js?v=10"></script>
</body>
</html>
